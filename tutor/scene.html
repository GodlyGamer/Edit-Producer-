<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:G;font-weight:400;src:url(assets/fonts/Geist-400.woff2)}
@font-face{font-family:G;font-weight:500;src:url(assets/fonts/Geist-500.woff2)}
@font-face{font-family:G;font-weight:600;src:url(assets/fonts/Geist-600.woff2)}
@font-face{font-family:G;font-weight:700;src:url(assets/fonts/Geist-700.woff2)}
@font-face{font-family:G;font-weight:800;src:url(assets/fonts/Geist-800.woff2)}
@font-face{font-family:G;font-weight:900;src:url(assets/fonts/Geist-900.woff2)}
@font-face{font-family:M;font-weight:500;src:url(assets/fonts/GeistMono-500.woff2)}
@font-face{font-family:M;font-weight:600;src:url(assets/fonts/GeistMono-600.woff2)}
html,body{margin:0;background:#000}canvas{display:block}
</style></head>
<body><canvas id="c" width="1080" height="1080"></canvas>
<script>
// Mentaljineer · Personalised Tutor prompt edit. render(t) draws the frame at time t (seconds).
// Numbers: 3,601 copies (live count on mentaljineer.pages.dev/api/prompts, Nov 2026), 3,000+ users
// and the 10,000 target are from Youssouf. Process details are quoted from the prompt itself.
const W=1080,H=1080;
const cv=document.getElementById('c');let x=cv.getContext('2d');
const P={paper:'#f2f2f3',paper2:'#e6e6e8',white:'#ffffff',ink:'#0e0e0f',muted:'#58585d',rule:'#d4d4d8',
  night:'#0b0b0c',night2:'#141416',onNight:'#f2f2f3',onNightMuted:'#9a9a9f',
  navy:'#060a26',navy2:'#111c5a',navy3:'#24348a',ice:'#aeb8e6',blue:'#7f9bff',blueHi:'#b7c6ff',ttBlue:'#8ec5ff'};

// ---------- helpers ----------
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const lerp=(a,b,k)=>a+(b-a)*k;
const prog=(t,a,b)=>clamp((t-a)/(b-a));
const eo=k=>1-Math.pow(1-k,3);
const eio=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
const eback=k=>{const c=1.7;return 1+(c+1)*Math.pow(k-1,3)+c*Math.pow(k-1,2)};
function rnd(seed){let s=seed>>>0||1;return()=>{s^=s<<13;s^=s>>>17;s^=s<<5;return((s>>>0)%100000)/100000}}
function bg(c){x.fillStyle=c;x.fillRect(0,0,W,H)}
function font(size,w=500,f='G'){x.font=`${w} ${size}px ${f}`}
function T(s,X,Y,size,{w=500,f='G',c=P.ink,a='left',alpha=1,ls=0}={}){
  x.save();x.globalAlpha*=alpha;font(size,w,f);x.fillStyle=c;x.textAlign=a;x.textBaseline='alphabetic';
  if(ls)x.letterSpacing=ls+'px';x.fillText(s,X,Y);x.restore();}
const typed=(s,k)=>s.slice(0,Math.round(s.length*clamp(k)));
function rr(X,Y,w,h,r){x.beginPath();x.roundRect(X,Y,w,h,r)}
function grain(alpha=.05,seed=1,col='#000'){const r=rnd(seed);x.save();x.globalAlpha=alpha;x.fillStyle=col;
  for(let i=0;i<1100;i++)x.fillRect(r()*W,r()*H,1.5,1.5);x.restore();}
function hud(label,num,dark=false){const c=dark?P.onNightMuted:P.muted;
  T(label,40,52,16,{f:'M',w:500,c,ls:1.5});T(num,W-40,52,16,{f:'M',w:500,c,a:'right',ls:1.5});}
function reticle(X,Y,r,c){x.save();x.strokeStyle=c;x.lineWidth=2;x.beginPath();x.arc(X,Y,r,0,7);x.stroke();
  x.beginPath();x.arc(X,Y,r*.45,0,7);x.stroke();x.beginPath();x.moveTo(X-r*1.3,Y);x.lineTo(X+r*1.3,Y);
  x.moveTo(X,Y-r*1.3);x.lineTo(X,Y+r*1.3);x.stroke();x.restore();}
function fmt(n){return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,',')}

const imgs={};
function load(n,src){return new Promise(r=>{const i=new Image();i.onload=()=>{imgs[n]=i;r()};i.src=src})}
function dragon(X,Y,s,{white=true,alpha=1,rot=0}={}){x.save();x.globalAlpha*=alpha;x.translate(X,Y);x.rotate(rot);
  x.drawImage(white?imgs.dw:imgs.db,-s/2,-s/2,s,s);x.restore();}
// glass orb (site's glass look) used as the "dot"
function orb(X,Y,r){x.save();
  const g=x.createRadialGradient(X-r*.3,Y-r*.35,r*.05,X,Y,r);
  g.addColorStop(0,'#ffffff');g.addColorStop(.35,P.blueHi);g.addColorStop(1,P.navy3);
  x.shadowColor='rgba(140,170,255,.7)';x.shadowBlur=r*.8;x.fillStyle=g;x.beginPath();x.arc(X,Y,Math.max(.01,r),0,7);x.fill();x.restore();}

// navy "horizon" sky with soft glass clouds
let cloudLayer=null;
function makeClouds(){const c=document.createElement('canvas');c.width=W*2;c.height=H;const g=c.getContext('2d');const r=rnd(7);g.filter='blur(12px)';
  const blob=(cx,cy,s)=>{for(let i=0;i<14;i++){const a=r()*Math.PI,d=r()*s;g.fillStyle=`rgba(200,212,255,${.18+r()*.25})`;
    g.beginPath();g.arc(cx+Math.cos(a)*d*1.8,cy-Math.sin(a)*d*.5,s*(.35+r()*.4),0,7);g.fill();}};
  for(let i=0;i<9;i++)blob(r()*W*2,900+r()*160,90+r()*70);for(let i=0;i<5;i++)blob(r()*W*2,200+r()*400,40+r()*40);
  g.filter='none';cloudLayer=c;}
const STARS=(()=>{const r=rnd(77),a=[];for(let i=0;i<140;i++)a.push([r()*W,r()*H*.75,r()]);return a})();
function sky(drift=0,t=0){const g=x.createLinearGradient(0,0,0,H);
  g.addColorStop(0,P.navy);g.addColorStop(.6,P.navy2);g.addColorStop(1,'#3a4aa8');x.fillStyle=g;x.fillRect(0,0,W,H);
  STARS.forEach(([sx,sy,s])=>{x.fillStyle=`rgba(238,241,255,${.25+.5*Math.abs(Math.sin(t*2+s*9))*s})`;x.fillRect(sx,sy,1.6+s,1.6+s);});
  x.drawImage(cloudLayer,-(drift%W),0);}

// dragon particle targets, sampled from the logo itself
let DPTS=[];
function sampleDragon(){const c=document.createElement('canvas');c.width=c.height=200;const g=c.getContext('2d');g.drawImage(imgs.db,0,0,200,200);
  const d=g.getImageData(0,0,200,200).data,r=rnd(5),pts=[];
  for(let y=0;y<200;y+=2)for(let X=0;X<200;X+=2){if(d[(y*200+X)*4+3]>128&&r()<.9)pts.push([X/200,y/200]);}
  DPTS=pts;}

// ---------- flapping dragon ----------
// The logo is one silhouette. Cut it into body + two wings (viewBox 0..496 units) and
// rotate each wing about its shoulder. Polygons were drawn against a gridded render of the mark.
const WING_L=[[0,0],[300,0],[318,262],[245,302],[0,302]], PIV_L=[300,262];
const WING_R=[[300,0],[496,0],[496,95],[395,128],[350,200],[345,224],[322,262],[318,262]], PIV_R=[328,252];
const DPART={};
function buildDragonParts(){
  const R=2; // build at 992px
  ['dw','db'].forEach(key=>{
    const img=imgs[key];
    const make=(poly,invert)=>{const c=document.createElement('canvas');c.width=c.height=496*R;const g=c.getContext('2d');
      g.drawImage(img,0,0,496*R,496*R);
      g.globalCompositeOperation=invert?'destination-out':'destination-in';
      const path=p=>{g.beginPath();p.forEach(([a,b],i)=>i?g.lineTo(a*R,b*R):g.moveTo(a*R,b*R));g.closePath();g.fill();};
      if(invert){path(WING_L);path(WING_R);}else path(poly);
      return c;};
    DPART[key]={body:make(null,true),L:make(WING_L),R:make(WING_R)};
  });
}
// phase in radians; a>0 = downstroke
// draw solid on a scratch canvas, then composite once, so overlapping parts never double up when faded
const FLAPBUF=document.createElement('canvas');FLAPBUF.width=FLAPBUF.height=1400;
function flapDragon(X,Y,s,phase,{white=true,alpha=1,rot=0}={}){
  const main=x,pad=s*.2,B=Math.ceil(s+pad*2);x=FLAPBUF.getContext('2d');x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,B,B);
  flapSolid(pad+s/2,pad+s/2,s,phase,white);
  x=main;x.save();x.globalAlpha*=alpha;x.translate(X,Y);x.rotate(rot);x.drawImage(FLAPBUF,0,0,B,B,-s/2-pad,-s/2-pad,B,B);x.restore();
}
function flapSolid(X,Y,s,phase,white){
  const parts=DPART[white?'dw':'db'],u=s/496,a=Math.sin(phase);
  x.save();x.translate(X,Y);x.translate(0,-a*s*.03);x.translate(-s/2,-s/2);
  const wing=(img,piv,ang,sx,sy)=>{x.save();x.translate(piv[0]*u,piv[1]*u);x.rotate(ang);x.scale(sx,sy);x.translate(-piv[0]*u,-piv[1]*u);
    x.drawImage(img,0,0,s,s);x.restore();};
  // far wing: mostly foreshortens toward the shoulder on the downstroke
  const fr=a>0?1-.32*a:1-.06*a;
  wing(parts.R,PIV_R,a*.1,fr,fr);
  x.drawImage(parts.body,0,0,s,s);
  // near wing: swings about the shoulder and flattens a little on the downstroke
  wing(parts.L,PIV_L,a>0?-a*.3:-a*.2,1,1-.14*Math.max(0,a));
  // hide the joint at the shoulder
  x.fillStyle=white?'#f2f2f3':'#0b0b0c';x.beginPath();x.arc((PIV_L[0]-4)*u,(PIV_L[1]+4)*u,24*u,0,7);x.fill();
  x.restore();
}
const FLAP=7.5; // wingbeat speed (rad/s)

// ---------- scenes (cut points mirror the reference edit) ----------
const scenes=[];const S=(a,b,fn)=>scenes.push({a,b,fn});

// small DAG used in several places: nodes held / to learn / goal
const DAG={n:[[0,.15,.2,'held'],[1,.15,.55,'held'],[2,.15,.88,'held'],[3,.45,.35,'held'],[4,.45,.75,'learn'],[5,.72,.55,'learn'],[6,.92,.55,'goal']],
  e:[[0,3],[1,3],[1,4],[2,4],[3,5],[4,5],[5,6]]};
function drawDAG(X0,Y0,w,h,k,{dark=false,covered=-1}={}){
  const pos=i=>[X0+DAG.n[i][1]*w,Y0+DAG.n[i][2]*h];
  x.save();x.lineWidth=3;x.strokeStyle=dark?'rgba(238,241,255,.5)':'rgba(14,14,15,.45)';
  DAG.e.forEach(([a,b],i)=>{const kk=clamp(k*DAG.e.length*1.2-i*.9);if(kk<=0)return;const A=pos(a),B=pos(b);
    x.beginPath();x.moveTo(...A);x.lineTo(lerp(A[0],B[0],kk),lerp(A[1],B[1],kk));x.stroke();});
  DAG.n.forEach(([i,,,st])=>{const kk=eback(clamp(k*DAG.n.length-i*.8));if(kk<=0)return;const [X,Y]=pos(i);
    const held=st==='held'||i<=covered;x.save();x.translate(X,Y);x.scale(kk,kk);
    if(st==='goal'){orb(0,0,26);}
    else{x.fillStyle=held?P.navy3:(dark?P.night2:P.paper);x.strokeStyle=P.navy3;x.lineWidth=4;x.beginPath();x.arc(0,0,22,0,7);x.fill();x.stroke();}
    x.restore();});
  x.restore();
}
function legend(X,Y,dark){const c=dark?P.onNightMuted:P.muted;
  [['held',P.navy3,true],['to learn',P.navy3,false],['goal',null,true]].forEach(([l,col,f],i)=>{const xx=X+i*150;
    if(col){x.beginPath();x.arc(xx,Y-6,9,0,7);x.lineWidth=3;x.strokeStyle=col;x.fillStyle=f?col:'transparent';if(f)x.fill();x.stroke();}else orb(xx,Y-6,10);
    T(l,xx+18,Y,17,{f:'M',c});});}
function quizCard(X,Y,w,q,opts,pick,dark=true){ // AskUserQuestion-style card
  x.save();x.fillStyle=dark?'#1c1c20':'#fff';rr(X,Y,w,90+opts.length*64,18);x.fill();
  T(q,X+28,Y+52,24,{w:600,c:dark?'#fff':P.ink});
  opts.forEach((o,i)=>{const yy=Y+80+i*64;const on=i===pick;
    x.fillStyle=on?P.navy3:(dark?'#2a2a2f':'#f0f0f2');rr(X+24,yy,w-48,50,12);x.fill();
    T(o,X+46,yy+33,20,{w:500,c:on?'#fff':(dark?'#ddd':P.ink),f:i===opts.length-1?'M':'G'});});
  x.restore();}
function paperSheet(X,Y,w,h,rot,lt){
  x.save();x.translate(X+w/2,Y+h/2);x.rotate(rot);x.translate(-w/2,-h/2);
  x.shadowColor='rgba(0,0,0,.18)';x.shadowBlur=36;x.shadowOffsetY=14;x.fillStyle='#fff';x.fillRect(0,0,w,h);x.shadowColor='transparent';
  T('Practice paper',w/2,62,30,{w:700,a:'center'});
  T('Time allowed: 40 minutes · Show your working',w/2,94,15,{f:'M',c:P.muted,a:'center'});
  x.fillStyle=P.ink;x.fillRect(40,112,w-80,1.5);
  const qs=[3,4,4,6,8];qs.forEach((m,i)=>{const y=150+i*Math.min(84,(h-180)/5);
    T(`${i+1}.`,40,y,20,{w:700});for(let j=0;j<2;j++){x.fillStyle=P.rule;x.fillRect(72,y-12+j*24,(w-200)*(j?.6:1)-((i*37)%60),7);}
    T(`[${m} marks]`,w-40,y,16,{f:'M',c:P.muted,a:'right'});});
  x.restore();}

S(0,1.8,t=>{
  bg(P.paper);
  x.save();font(1150,800);x.strokeStyle=P.rule;x.lineWidth=3;x.strokeText('T',150,1010);x.restore();
  hud('MENTALJINEER — PROMPT LIBRARY','Nº 01');reticle(W-110,H-110,28,P.muted);
  const lines=['learn at','the edge','of what','you know.'];
  if(t<1.0){
    lines.forEach((s,i)=>{const k=prog(t,i*.16,i*.16+.2);T(typed(s,k),70,300+i*140,124,{w:i===3?800:500,ls:-3});});
  } else {
    const k=prog(t,1.0,1.35);
    lines.forEach((s,i)=>T(s,70,300+i*140,124,{w:i===3?800:500,ls:-3,alpha:1-k}));
    [...'tutor'].forEach((ch,i)=>{const kk=eo(prog(t,1.1+i*.06,1.35+i*.06));T(ch,80-(1-kk)*30,240+i*170,170,{w:700,c:P.navy3,alpha:kk});});
  }
  grain(.04,3);
});

S(1.8,2.63,t=>{
  bg(P.paper);
  const cuts=[[1.8,'p','Probe',-60,1060],[2.08,'m','Map',-260,1060],[2.36,'q','Quiz',-40,1060]];
  let cur=cuts[0];cuts.forEach(c=>{if(t>=c[0])cur=c});const lt=t-cur[0],s=1+lt*.35;
  x.save();x.translate(W/2,H/2);x.scale(s,s);x.translate(-W/2,-H/2);T(cur[1],cur[3],cur[4],1500,{w:900,ls:-20});x.restore();
  font(30,600);const tw=x.measureText(cur[2]).width;x.fillStyle=P.ink;x.fillRect(60,H-120,tw+36,52);T(cur[2],78,H-83,30,{w:600,c:P.paper});
});

S(2.63,4.4,t=>{
  bg(P.paper);grain(.035,5);const lt=t-2.63,z=1+lt*.02;
  x.save();x.translate(W/2,H/2);x.scale(z,z);x.translate(-W/2,-H/2);
  T(typed('tutor',prog(lt,0,.3)),66,200,150,{w:700,ls:-5});
  T('\\ ˈtjuː-tə \\  noun',72,262,28,{f:'M',c:P.muted,alpha:prog(lt,.25,.4)});
  T(typed('1. someone who teaches one person at a time.',prog(lt,.4,.9)),72,340,33,{w:500});
  T(typed('2. a free prompt on mentaljineer.pages.dev. 3,601 copies.',prog(lt,.95,1.5)),72,396,33,{w:500});
  x.fillStyle=P.ink;x.fillRect(72,450,W*.8*eo(prog(lt,.5,1.2)),2);
  const cols=[[['Model','Claude'],['Category','Learning'],['Version','V2'],['Copies','3,601']],
              [['Probe','10–20 Qs'],['Step','1 new idea'],['Message','<150 words'],['Drawing','first']],
              [['Paper','4–8 Qs'],['Time','30–45 min'],['Marks','M1 · A1'],['Resume','state block']]];
  cols.forEach((col,ci)=>col.forEach(([a,b],i)=>{const k=prog(lt,.6+ci*.1+i*.05,.75+ci*.1+i*.05);
    T(a,72+ci*335,510+i*48,19,{f:'M',c:P.muted,alpha:k});T(b,72+ci*335+130,510+i*48,22,{w:700,alpha:k});
    x.save();x.globalAlpha=k*.6;x.fillStyle=P.rule;x.fillRect(72+ci*335,522+i*48,300,1.5);x.restore();}));
  x.restore();hud('TUTOR — DEFINITION','Nº 02');
});

S(4.4,6.57,t=>{
  bg(P.paper);
  if(t<5.0){const k=eo(prog(t,4.4,4.65));
    x.save();x.strokeStyle=P.rule;x.lineWidth=1.5;[430,500,570].forEach(y=>{x.beginPath();x.moveTo(60,y);x.lineTo(60+(W-120)*k,y);x.stroke();});x.restore();
    T('Personalised',W/2,500,150,{w:800,a:'center',alpha:k,ls:-6});
    T('Tutor',W/2,650,150,{w:800,a:'center',alpha:prog(t,4.55,4.7),ls:-6,c:P.navy3});
  } else {
    const words=[[5.0,'probe.'],[5.4,'teach.'],[5.8,'test.']];let cur=words[0];words.forEach(w=>{if(t>=w[0])cur=w});
    if(cur[1]!=='test.'||t<6.05){const s=lerp(.94,1,eo(clamp((t-cur[0])/.15)));
      x.save();x.translate(W/2,H/2);x.scale(s,s);T(cur[1],0,40,120,{w:700,a:'center',ls:-3});x.restore();}
    else{const k=prog(t,6.05,6.3);font(120,700);x.letterSpacing='-3px';
      const full=x.measureText('test.').width,fw=x.measureText('test').width;x.letterSpacing='0px';const x0=W/2-full/2;
      T('test',x0,H/2+40,120,{w:700,ls:-3,alpha:1-k});
      const dx=lerp(x0+fw+10,W/2,eio(k)),r=lerp(11,16,prog(t,6.3,6.57));
      x.fillStyle=P.ink;x.beginPath();x.arc(dx,H/2+30-lerp(0,30,eio(k)),r,0,7);x.fill();}
  }
  grain(.03,9);
});

// the dot becomes the orb, the orb hatches the dragon, and it starts flapping
S(6.57,7.57,t=>{
  bg(P.night);const lt=t-6.57;
  if(lt<.4){orb(W/2,H/2,lerp(16,140,eback(prog(lt,0,.3))));}
  else{const k=prog(lt,.4,.75);orb(W/2,H/2,lerp(140,0,eio(clamp(k*1.6))));
    flapDragon(W/2,H/2,lerp(120,560,eback(k)),lt*FLAP*1.4,{alpha:clamp(k*2)});}
});

S(7.57,9.2,t=>{
  bg(P.paper2);grain(.04,11);
  if(t<8.5){const lt=t-7.57;
    x.save();x.translate(W/2,H/2);x.rotate(-.035+lt*.02);x.translate(-W/2,-H/2);
    x.shadowColor='rgba(0,0,0,.14)';x.shadowBlur=40;x.shadowOffsetY=16;x.fillStyle=P.white;rr(130,230,820,600,22);x.fill();x.shadowColor='transparent';
    T('Your path, as a graph',180,310,36,{w:700});T('DRAWN BEFORE ANY TEACHING',180,346,16,{f:'M',c:P.muted,ls:1});
    drawDAG(200,390,680,340,eo(prog(lt,.05,.75)));legend(200,800,false);
    x.restore();
  } else {const lt=t-8.5;
    const words='Test edges, not nodes · Draw the picture before the prose · "I don\'t know" is data · Only a correct answer moves us forward · One new named thing per step · Understanding is the structure over the facts · '.repeat(3);
    font(17,500,'M');x.fillStyle=P.ink;const rows=16;
    for(let r=0;r<rows;r++){const y=360+r*24,half=Math.sin(r/rows*Math.PI),w=lerp(160,560,half);
      const st=(r*23)%90,str=words.slice(st,st+Math.floor(w/10.2)),sw=lt*1.6;
      x.save();x.globalAlpha=1-prog(lt,.45,.7);x.translate(W/2+Math.sin(r*.6+lt*5)*40*sw-w/2+r*sw*18,y-sw*60*Math.cos(r*.3));
      x.rotate(-sw*.25);x.fillText(str,0,0);x.restore();}
  }
});

// particles swarm into the dragon; it comes alive and flies off flapping
const PR=rnd(33);let PSTART=[];
S(9.2,10.87,t=>{
  const lt=t-9.2;sky(lt*40,t);
  if(!PSTART.length)PSTART=DPTS.map(()=>[PR(),PR(),PR()]);
  const k=eio(prog(lt,.1,.8)),size=640,ox=W/2-size/2+20,oy=H/2-size/2-20;
  const fly=prog(lt,1.0,1.67),fx=eio(fly)*520,fy=-eio(fly)*170;
  const pa=1-prog(lt,.8,.95);
  if(pa>0){x.fillStyle=`rgba(238,241,255,${.92*pa})`;
    DPTS.forEach((p,i)=>{const s=PSTART[i];const ang=s[0]*7+lt*2.2,rad=110+s[1]*200;
      const sx=W/2-60+Math.cos(ang)*rad*1.45+Math.sin(lt*3+s[2]*6)*40,sy=H/2-40+Math.sin(ang*1.3)*rad*.55;
      x.fillRect(lerp(sx,ox+p[0]*size,k),lerp(sy,oy+p[1]*size,k),3.4,3.4);});}
  if(lt>.8){const ph=Math.max(0,lt-.95)*FLAP*1.3;flapDragon(W/2+20+fx,H/2-20+fy,size*lerp(1,.75,fly),ph,{alpha:prog(lt,.8,.95)});}
});

S(10.87,12.5,t=>{
  const lt=t-10.87;sky(400+lt*30,t);
