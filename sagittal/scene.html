<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:B;font-weight:400;src:url(assets/fonts/Barlow-400-latin.woff2)}
@font-face{font-family:B;font-weight:500;src:url(assets/fonts/Barlow-500-latin.woff2)}
@font-face{font-family:B;font-weight:600;src:url(assets/fonts/Barlow-600-latin.woff2)}
@font-face{font-family:B;font-weight:700;src:url(assets/fonts/Barlow-700-latin.woff2)}
@font-face{font-family:C;font-weight:700;src:url(assets/fonts/BarlowCondensed-700-latin.woff2)}
@font-face{font-family:C;font-weight:800;src:url(assets/fonts/BarlowCondensed-800-latin.woff2)}
html,body{margin:0;background:#000}
canvas{display:block}
</style></head>
<body><canvas id="c" width="1080" height="1080"></canvas>
<script>
// Sagittal Tennis brand edit. render(t) draws frame at time t (seconds).
const W = 1080, H = 1080;
const cv = document.getElementById('c'), x = cv.getContext('2d');
const P = { paper:'#f3f4ef', paper2:'#e8eae3', surface:'#ffffff', ink:'#111513', muted:'#59605c',
  rule:'#d6dad2', accent:'#2e5e4e', soft:'#e1eae5', ball:'#ddf24c', night:'#0e1311', night2:'#18201c',
  onNight:'#f3f4ef', onNightMuted:'#a7b0ab', logoBg:'#1b1e20' };

// ---------- helpers ----------
const clamp = (v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const lerp = (a,b,k)=>a+(b-a)*k;
const prog = (t,a,b)=>clamp((t-a)/(b-a));
const eo = k=>1-Math.pow(1-k,3);            // ease out cubic
const eio = k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
const eback = k=>{const c=1.7;return 1+(c+1)*Math.pow(k-1,3)+c*Math.pow(k-1,2)};
function rnd(seed){let s=seed>>>0||1;return()=>{s^=s<<13;s^=s>>>17;s^=s<<5;return((s>>>0)%100000)/100000}}
function bg(c){x.fillStyle=c;x.fillRect(0,0,W,H)}
function font(size,w=500,f='B'){x.font=`${w} ${size}px ${f}`}
function T(s,X,Y,size,{w=500,f='B',c=P.ink,a='left',b='alphabetic',alpha=1,ls=0}={}){
  x.save();x.globalAlpha*=alpha;font(size,w,f);x.fillStyle=c;x.textAlign=a;x.textBaseline=b;
  if(ls){x.letterSpacing=ls+'px'}
  x.fillText(s,X,Y);x.restore();
}
function typed(s,k){return s.slice(0,Math.round(s.length*clamp(k)))}
function rr(X,Y,w,h,r){x.beginPath();x.roundRect(X,Y,w,h,r)}
function grain(alpha=.05,seed=1){ // subtle paper grain
  const r=rnd(seed);x.save();x.globalAlpha=alpha;x.fillStyle='#000';
  for(let i=0;i<900;i++){x.fillRect(r()*W,r()*H,1.5,1.5)}x.restore();
}
// HUD like the reference: small header label + number, corner mark
function hud(label,num,dark=false){
  const c=dark?P.onNightMuted:P.muted;
  T(label,40,52,17,{f:'C',w:700,c,ls:2});
  T(num,W-40,52,17,{f:'C',w:700,c,a:'right',ls:2});
}
function crosshair(X,Y,r,c){x.save();x.strokeStyle=c;x.lineWidth=2;
  x.beginPath();x.arc(X,Y,r,0,7);x.stroke();x.beginPath();x.arc(X,Y,r*.45,0,7);x.stroke();
  x.beginPath();x.moveTo(X-r*1.3,Y);x.lineTo(X+r*1.3,Y);x.moveTo(X,Y-r*1.3);x.lineTo(X,Y+r*1.3);x.stroke();x.restore();}

// tennis ball with seam
function ball(X,Y,r,rot=0,col=P.ball){
  r=Math.max(0.01,r);
  x.save();x.translate(X,Y);
  const g=x.createRadialGradient(-r*.35,-r*.35,r*.1,0,0,r);
  g.addColorStop(0,'#f1fb9a');g.addColorStop(.7,col);g.addColorStop(1,'#a9bb26');
  x.fillStyle=g;x.beginPath();x.arc(0,0,r,0,7);x.fill();
  x.clip();x.rotate(rot);x.strokeStyle='rgba(255,255,255,.9)';x.lineWidth=r*.09;
  x.beginPath();x.arc(-r*1.25,0,r*.85,-1.1,1.1);x.stroke();
  x.beginPath();x.arc(r*1.25,0,r*.85,Math.PI-1.1,Math.PI+1.1);x.stroke();
  x.restore();
}
// brand logo (from favicon.svg: dark rounded square, ball, baseline)
function logo(X,Y,s,k=1){ // s = size px, k = build progress
  x.save();x.translate(X,Y);const u=s/64;
  x.globalAlpha=clamp(k*3);
  x.fillStyle=P.logoBg;rr(0,0,64*u,64*u,14*u);x.fill();
  x.globalAlpha=1;
  const kb=eback(prog(k,.2,.7));
  x.fillStyle=P.ball;x.beginPath();x.arc(38*u,24*u,Math.max(0,10*u*kb),0,7);x.fill();
  const kl=eo(prog(k,.5,1));
  x.fillStyle='#eef0ec';rr(12*u,44*u,40*u*kl,5*u,u);x.fill();
  x.restore();
}

// skeleton from the site hero (shot-3.jpg 720x710 coords)
const SK = {head:[352,112],sh:[345,185],el:[435,233],wr:[510,187],hipL:[345,393],hipR:[372,393],
  kL:[296,515],aL:[178,598],tL:[176,665],kR:[410,505],aR:[425,630],tR:[480,680]};
const SKL=[['sh','el'],['el','wr'],['sh','hipL'],['sh','hipR'],['hipL','hipR'],['hipL','kL'],['kL','aL'],['aL','tL'],['hipR','kR'],['kR','aR'],['aR','tR']];
function skel(ox,oy,sc,{c='#fff',jc=P.ball,lw=6,k=1,joints=true}={}){
  x.save();x.lineCap='round';x.strokeStyle=c;x.lineWidth=lw;
  const p=n=>[ox+(SK[n][0]-350)*sc,oy+(SK[n][1]-400)*sc];
  SKL.forEach(([a,b],i)=>{const kk=clamp(k*SKL.length-i);if(kk<=0)return;
    const A=p(a),B=p(b);x.beginPath();x.moveTo(...A);x.lineTo(A[0]+(B[0]-A[0])*kk,A[1]+(B[1]-A[1])*kk);x.stroke();});
  if(joints){x.fillStyle=jc;Object.keys(SK).forEach(n=>{if(n==='head')return;const A=p(n);x.beginPath();x.arc(A[0],A[1],lw*.95,0,7);x.fill();})}
  x.restore();
}
function skelPoints(n,seed){const r=rnd(seed),pts=[];
  for(let i=0;i<n;i++){const [a,b]=SKL[Math.floor(r()*SKL.length)];const k=r();
    pts.push([lerp(SK[a][0],SK[b][0],k),lerp(SK[a][1],SK[b][1],k)]);}
  // head ring
  for(let i=0;i<n*.12;i++){const ang=r()*7;pts.push([SK.head[0]+Math.cos(ang)*38,SK.head[1]+Math.sin(ang)*44]);}
  return pts;}

// soft clouds on pastel court-green sky
let cloudLayer=null;
function makeClouds(){
  const c=document.createElement('canvas');c.width=W*2;c.height=H;const g=c.getContext('2d');
  const r=rnd(7);g.filter='blur(10px)';
  const blob=(cx,cy,s)=>{for(let i=0;i<14;i++){const a=r()*Math.PI,d=r()*s;
    g.fillStyle=`rgba(255,255,255,${.55+r()*.4})`;g.beginPath();g.arc(cx+Math.cos(a)*d*1.8,cy-Math.sin(a)*d*.5,s*(.35+r()*.4),0,7);g.fill();}};
  for(let i=0;i<9;i++)blob(r()*W*2,880+r()*160,90+r()*70);
  for(let i=0;i<5;i++)blob(r()*W*2,180+r()*420,40+r()*40);
  g.filter='none';cloudLayer=c;
}
function sky(drift=0){
  const g=x.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#9fb9ad');g.addColorStop(.55,'#d8e3dc');g.addColorStop(1,'#f0ece2');
  x.fillStyle=g;x.fillRect(0,0,W,H);
  x.drawImage(cloudLayer,-((drift)%W),0);
}

const imgs={};
function load(name,src){return new Promise(r=>{const i=new Image();i.onload=()=>{imgs[name]=i;r()};i.src=src})}

// ---------- scenes ----------
// timings mirror the cut points of the reference edit
const scenes=[];
const S=(a,b,fn)=>scenes.push({a,b,fn});

// 0 – 1.0 : "find the one fix" typed on paper, ghost S behind
S(0,1.8,(t)=>{
  bg(P.paper);
  x.save();x.globalAlpha=.9;font(1200,800,'C');x.strokeStyle=P.rule;x.lineWidth=3;x.strokeText('S',150,1080);x.restore();
  hud('SAGITTAL — SWING ANALYSIS','Nº 01');
  crosshair(W-110,H-110,28,P.muted);
  const lines=['find','the','one','fix.'];
  if(t<1.0){
    lines.forEach((s,i)=>{const k=prog(t,i*.17,i*.17+.18);
      T(typed(s,k),70,330+i*150,150,{w:i===3?700:500});});
    // weight specimen column, like the reference
    const ws=[['Regular',400],['Medium',500],['Semibold',600],['Bold',700]];
    ws.forEach(([s,w],i)=>{const k=prog(t,.45+i*.08,.55+i*.08);T(s,640,330+i*70,38,{w,alpha:k,c:P.ink});});
  } else {
    const k=prog(t,1.0,1.35);
    lines.forEach((s,i)=>{T(s,70,330+i*150,150,{w:i===3?700:500,alpha:1-k,c:i===3?P.accent:P.ink});});
    const word='swing';
    [...word].forEach((ch,i)=>{const kk=eo(prog(t,1.15+i*.06,1.4+i*.06));
      T(ch,70+(1-kk)*-30,250+i*170,170,{w:600,c:P.accent,alpha:kk});});
  }
  grain(.04,3);
});

// 1.8 – 2.63 : giant cropped letterforms with stroke labels
S(1.8,2.63,(t)=>{
  bg(P.paper);
  const cuts=[[1.8,'S','Forehand',-80,1380],[2.08,'w','Backhand',-260,1180],[2.36,'g','Serve',-120,1000]];
  let cur=cuts[0];cuts.forEach(c=>{if(t>=c[0])cur=c});
  const lt=t-cur[0];const s=1+lt*.35;
  x.save();x.translate(W/2,H/2);x.scale(s,s);x.translate(-W/2,-H/2);
  T(cur[1],cur[3],cur[4],1500,{f:'C',w:800,c:P.ink});x.restore();
  // label tag
  font(30,600);const tw=x.measureText(cur[2]).width;
  x.fillStyle=P.ink;x.fillRect(60,H-120,tw+36,52);
  T(cur[2],78,H-83,30,{w:600,c:P.paper});
  ball(60+tw+70,H-94,16,lt*6);
});

// 2.63 – 4.4 : dictionary entry
S(2.63,4.4,(t)=>{
  bg(P.paper);grain(.035,5);
  const lt=t-2.63;
  const zoom=1+lt*.02;x.save();x.translate(W/2,H/2);x.scale(zoom,zoom);x.translate(-W/2,-H/2);
  T(typed('sagittal',prog(lt,0,.35)),70,200,170,{w:700,f:'C',ls:-2});
  T('\\ ˈsa-jə-tᵊl \\  adjective',74,270,30,{w:400,c:P.muted,alpha:prog(lt,.3,.45)});
  T(typed('1. dividing the body into left and right halves.',prog(lt,.45,.95)),74,350,36,{w:500});
  T(typed('2. a free, research-based tennis swing analysis.',prog(lt,1.05,1.55)),74,410,36,{w:500});
  // rule
  x.fillStyle=P.ink;x.fillRect(74,470,W*.78*eo(prog(lt,.5,1.2)),2);
  // small columns of real metric names
  const cols=[['Swing Score','Balance','Stance Width','Load & Hold'],['Head Stability','Technique Consistency','Contact point','Weight transfer'],['Front leg at contact','Take-back height','Your one fix','Try this next']];
  cols.forEach((col,ci)=>col.forEach((s,i)=>{const k=prog(lt,.6+ci*.1+i*.05,.75+ci*.1+i*.05);
    T(s,74+ci*310,530+i*40,22,{w:600,f:'C',c:P.ink,alpha:k,ls:.5});
    x.save();x.globalAlpha=k*.35;x.fillStyle=P.muted;x.fillRect(74+ci*310,540+i*40,180+((i*37+ci*53)%90),3);x.restore();}));
  x.restore();
  hud('SAGITTAL — DEFINITION','Nº 02');
});

// 4.4 – 6.57 : wordmark, then film. / upload. / fix. → dot
S(4.4,6.57,(t)=>{
  bg(P.paper);
  if(t<5.0){
    const k=eo(prog(t,4.4,4.65));
    // construction guides
    x.save();x.strokeStyle=P.rule;x.lineWidth=1.5;
    [470,540,610].forEach(y=>{x.beginPath();x.moveTo(60,y);x.lineTo(60+(W-120)*k,y);x.stroke();});
    x.beginPath();x.arc(W/2+190,470,46,0,7*k);x.stroke();x.restore();
    T('sagittal',W/2,610,220,{f:'C',w:800,a:'center',alpha:k});
  } else {
    const words=[[5.0,'film.'],[5.4,'upload.'],[5.8,'fix.']];
    let cur=words[0];words.forEach(w=>{if(t>=w[0])cur=w});
    const lt=t-cur[0];
    if(cur[1]!=='fix.'||t<6.05){
      const s=lerp(.94,1,eo(clamp(lt/.15)));
      x.save();x.translate(W/2,H/2);x.scale(s,s);
      T(cur[1],0,40,120,{w:700,a:'center'});x.restore();
    } else {
      // "fix." melts away, its period becomes a dot that grows
      const k=prog(t,6.05,6.3);
      font(120,700);const full=x.measureText('fix.').width,fw=x.measureText('fix').width;
      const x0=W/2-full/2;
      T('fix',x0,H/2+40,120,{w:700,alpha:1-k,c:k>0?P.muted:P.ink});
      const dx=lerp(x0+fw+12,W/2,eio(k)),r=lerp(11,16,prog(t,6.3,6.57));
      x.fillStyle=P.ink;x.beginPath();x.arc(dx,H/2+30-lerp(0,30,eio(k)),r,0,7);x.fill();
    }
  }
  grain(.03,9);
});

// 6.57 – 7.57 : night. dot becomes the ball, ball becomes the logo
S(6.57,7.57,(t)=>{
  bg(P.night);
  const lt=t-6.57;
  if(lt<.45){
    const r=lerp(16,150,eback(prog(lt,0,.3)));
    ball(W/2,H/2,r,lt*9);
  } else {
    const k=prog(lt,.45,.9);
    const s=lerp(300,420,eo(k));
    // ball travels into its slot in the logo
    logo(W/2-s/2,H/2-s/2,s,k);
    if(k<.35){ball(W/2,H/2,lerp(150,0,k/.35),lt*9)}
  }
});

// 7.57 – 9.2 : progress chart card, then report text swirl
S(7.57,9.2,(t)=>{
  bg(P.paper2);grain(.04,11);
  if(t<8.5){
    const lt=t-7.57;
    x.save();x.translate(W/2,H/2);x.rotate(-.04+lt*.02);x.translate(-W/2,-H/2);
    x.shadowColor='rgba(0,0,0,.12)';x.shadowBlur=40;x.shadowOffsetY=16;
    x.fillStyle=P.surface;rr(150,220,780,620,18);x.fill();x.shadowColor='transparent';
    T('My progress',200,300,40,{w:700});
    T('SWING SCORE',200,336,20,{f:'C',w:700,c:P.muted,ls:2});
    const vals=[48,52,58,63];const X0=230,X1=860,Y0=760,Y1=420;
    x.strokeStyle=P.rule;x.lineWidth=2;x.beginPath();x.moveTo(X0,Y0);x.lineTo(X1,Y0);x.moveTo(X0,Y0);x.lineTo(X0,Y1-40);x.stroke();
    const pts=vals.map((v,i)=>[X0+40+i*190,lerp(Y0,Y1,(v-40)/30)]);
    const k=eo(prog(lt,.1,.75))*(pts.length-1);
    x.strokeStyle=P.accent;x.lineWidth=7;x.lineJoin='round';x.lineCap='round';x.beginPath();x.moveTo(...pts[0]);
    for(let i=1;i<=Math.floor(k);i++)x.lineTo(...pts[i]);
    const f=k-Math.floor(k),i0=Math.floor(k);if(i0<pts.length-1)x.lineTo(lerp(pts[i0][0],pts[i0+1][0],f),lerp(pts[i0][1],pts[i0+1][1],f));
    x.stroke();
    pts.forEach((p,i)=>{if(k>=i-.01){const last=i===3;
      x.fillStyle=last?P.ball:P.accent;x.beginPath();x.arc(p[0],p[1],last?16:10,0,7);x.fill();
      if(last){x.strokeStyle=P.ink;x.lineWidth=3;x.stroke()}
      T(String(vals[i]),p[0],p[1]-30,30,{w:700,a:'center'});
      T('W'+(i+1),p[0],Y0+40,22,{f:'C',w:700,c:P.muted,a:'center'});}});
    x.restore();
  } else {
    const lt=t-8.5;
    const words='Shot 2 at contact · front knee 167° · weight moving into the ball · head steady · Load & Hold · Stance Width · Balance · Contact point · Weight transfer · Your one fix · Keep this report. Beat it next week. · '.repeat(3);
    font(17,600,'C');x.fillStyle=P.ink;
    const rows=16;
    for(let r=0;r<rows;r++){
      const y=360+r*24, half=Math.sin(r/rows*Math.PI);
      const w=lerp(160,560,half);
      const start=(r*23)%80;
      const str=words.slice(start,start+Math.floor(w/7.2));
      const sw=lt*1.6;
      x.save();x.globalAlpha=1-prog(lt,.45,.7);
      x.translate(W/2+Math.sin(r*.6+lt*5)*40*sw-w/2+r*sw*18,y-sw*60*Math.cos(r*.3));
      x.rotate(-sw*.25);x.fillText(str,0,0);x.restore();
    }
  }
});

// 9.2 – 10.87 : particles flock into a skeleton, ball flies through
const PTS=skelPoints(900,21);const PR=rnd(33);const PSTART=PTS.map(()=>[PR(),PR(),PR()]);
S(9.2,10.87,(t)=>{
  const lt=t-9.2;sky(lt*40);
  const k=eio(prog(lt,.1,.85));
  const sc=1.05,ox=W/2+20,oy=H/2+40;
  x.fillStyle='rgba(17,21,19,.85)';
  PTS.forEach((p,i)=>{const s=PSTART[i];
    const ang=s[0]*7+lt*2.2, rad=120+s[1]*190;
    const fx=W/2-80+Math.cos(ang)*rad*1.4+Math.sin(lt*3+s[2]*6)*40;
    const fy=H/2-60+Math.sin(ang*1.3)*rad*.55;
    const tx=ox+(p[0]-350)*sc,ty=oy+(p[1]-400)*sc;
    const X=lerp(fx,tx,k),Y=lerp(fy,ty,k);
    x.fillRect(X,Y,3.2,3.2);});
  if(lt>.85){const kk=prog(lt,.85,1.1);skel(ox,oy,sc,{c:P.ink,jc:P.ball,lw:7,k:kk});}
  // ball arc across
  if(lt>1.0){const kb=prog(lt,1.0,1.67);
    const bx=lerp(-60,W+60,kb),by=420-Math.sin(kb*Math.PI)*160;
    for(let i=6;i>0;i--){x.globalAlpha=.08*i;ball(bx-i*22,by+Math.cos(kb*Math.PI)*i*10,14,0);}x.globalAlpha=1;
    ball(bx,by,18,kb*20);}
});

// 10.87 – 12.5 : flag with logo rising from clouds, then bars
S(10.87,12.5,(t)=>{
  const lt=t-10.87;sky(400+lt*30);
  if(t<11.9){
    const cam=lt*120; // camera moves up
    x.save();x.translate(0,cam*.6);
    const px=W/2+40;
    x.fillStyle='#46705f';x.fillRect(px-70,880,140,300); // net-post base
    x.fillStyle='#2e5e4e';x.fillRect(px-8,330,16,560);
    x.fillStyle=P.ink;x.beginPath();x.arc(px,322,14,0,7);x.fill();
    // waving flag
    const fw=200,fh=130;x.save();x.translate(px+8,350);
    x.fillStyle='#fff';x.beginPath();x.moveTo(0,0);
    for(let i=0;i<=20;i++){const u=i/20;x.lineTo(u*fw,Math.sin(u*5-lt*9)*12*u);}
    for(let i=20;i>=0;i--){const u=i/20;x.lineTo(u*fw,fh+Math.sin(u*5-lt*9)*12*u);}
    x.closePath();x.fill();
    x.restore();
    logo(px+8+fw/2-38,350+fh/2-38+Math.sin(.5*5-lt*9)*6,76,1);
    x.restore();
    x.drawImage(cloudLayer,-(lt*80)%W-200,90);
  } else {
    const k=prog(t,11.9,12.5);
    const n=9;
    for(let i=0;i<n;i++){
      const h=(120+i*i*7.5)*eback(prog(k,i*.05,.45+i*.05));
      const bx=110+i*(W-220)/(n-1),w=46;
      x.fillStyle=i===n-1?P.accent:'#5f8a6f';rr(bx-w/2,900-h,w,h+200,6);x.fill();
      x.fillStyle='rgba(255,255,255,.25)';x.fillRect(bx-w/2+6,900-h+8,8,h-16);
      if(i===n-1&&h>40){x.fillStyle=P.ink;x.fillRect(bx-1.5,900-h-90,3,90);
        logo(bx+2,900-h-90,40,1);}
    }
    x.drawImage(cloudLayer,-200,140);
  }
});

// 12.5 – 14.0 : wordmark types on sky; dot of the i becomes a bouncing ball
S(12.5,14.0,(t)=>{
  const lt=t-12.5;sky(600+lt*25);
  const word='sagittal';
  const n=Math.min(word.length,Math.floor(lt/.11)+1);
  font(210,800,'C');const full=x.measureText(word).width;
  const x0=W/2-full/2;
  const shown=word.slice(0,n);
  T(shown,x0,H/2+70,210,{f:'C',w:800});
  // highlight the 'i' tittle swap with a ball once complete
  if(n===word.length){
    const pre=x.measureText('sag').width,iw=x.measureText('i').width;
    const cx=x0+pre+iw/2,cy=H/2-80;
    const k=prog(lt,.95,1.5);
    // cover existing tittle
    sky2patch(cx,cy);
    const bounce=Math.abs(Math.sin(k*Math.PI*2))*90*(1-k);
    ball(cx,cy-bounce,lerp(14,20,eback(prog(lt,.9,1.05))),k*8);
  }
});
