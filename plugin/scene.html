<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:G;font-weight:400;src:url(assets/fonts/Geist-400.woff2)}
@font-face{font-family:G;font-weight:500;src:url(assets/fonts/Geist-500.woff2)}
@font-face{font-family:G;font-weight:600;src:url(assets/fonts/Geist-600.woff2)}
@font-face{font-family:G;font-weight:700;src:url(assets/fonts/Geist-700.woff2)}
@font-face{font-family:G;font-weight:800;src:url(assets/fonts/Geist-800.woff2)}
@font-face{font-family:G;font-weight:900;src:url(assets/fonts/Geist-900.woff2)}
@font-face{font-family:N;font-weight:300 800;src:url(assets/fonts/Newsreader-var.woff2)}
@font-face{font-family:M;font-weight:500;src:url(assets/fonts/GeistMono-500.woff2)}
@font-face{font-family:M;font-weight:600;src:url(assets/fonts/GeistMono-600.woff2)}
html,body{margin:0;background:#000}canvas{display:block}
</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script>
// Mentaljineer · Adaptive Tutor plugin tutorial (cinematic, 16:9). render(t) draws the frame at time t (seconds).
// Numbers: 3,601 copies (live count on mentaljineer.pages.dev/api/prompts, Nov 2026), 3,000+ users
// and the 10,000 target are from Youssouf. Process details are quoted from the prompt itself.
const W=1920,H=1080;
const cv=document.getElementById('c');let x=cv.getContext('2d');
const P={paper:'#f2f2f3',paper2:'#e6e6e8',white:'#ffffff',ink:'#0e0e0f',muted:'#58585d',rule:'#d4d4d8',
  night:'#0b0b0c',night2:'#141416',onNight:'#f2f2f3',onNightMuted:'#9a9a9f',
  navy:'#060a26',navy2:'#111c5a',navy3:'#24348a',ice:'#aeb8e6',blue:'#7f9bff',blueHi:'#b7c6ff',ttBlue:'#8ec5ff'};

// ---------- helpers ----------
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const lerp=(a,b,k)=>a+(b-a)*k;
const prog=(t,a,b)=>clamp((t-a)/(b-a));
const eo=k=>1-Math.pow(1-k,3);
const eio=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
const eback=k=>{const c=1.7;return 1+(c+1)*Math.pow(k-1,3)+c*Math.pow(k-1,2)};
function rnd(seed){let s=seed>>>0||1;return()=>{s^=s<<13;s^=s>>>17;s^=s<<5;return((s>>>0)%100000)/100000}}
function bg(c){x.fillStyle=c;x.fillRect(0,0,W,H)}
function font(size,w=500,f='G'){x.font=`${w} ${size}px ${f}`}
function T(s,X,Y,size,{w=500,f='G',c=P.ink,a='left',alpha=1,ls=0}={}){
  x.save();x.globalAlpha*=alpha;font(size,w,f);x.fillStyle=c;x.textAlign=a;x.textBaseline='alphabetic';
  if(ls)x.letterSpacing=ls+'px';x.fillText(s,X,Y);x.restore();}
const typed=(s,k)=>s.slice(0,Math.round(s.length*clamp(k)));
function rr(X,Y,w,h,r){x.beginPath();x.roundRect(X,Y,w,h,r)}
function grain(alpha=.05,seed=1,col='#000'){const r=rnd(seed);x.save();x.globalAlpha=alpha;x.fillStyle=col;
  for(let i=0;i<1100;i++)x.fillRect(r()*W,r()*H,1.5,1.5);x.restore();}
function hud(label,num,dark=false){const c=dark?P.onNightMuted:P.muted;
  T(label,40,52,16,{f:'M',w:500,c,ls:1.5});T(num,W-40,52,16,{f:'M',w:500,c,a:'right',ls:1.5});}
function reticle(X,Y,r,c){x.save();x.strokeStyle=c;x.lineWidth=2;x.beginPath();x.arc(X,Y,r,0,7);x.stroke();
  x.beginPath();x.arc(X,Y,r*.45,0,7);x.stroke();x.beginPath();x.moveTo(X-r*1.3,Y);x.lineTo(X+r*1.3,Y);
  x.moveTo(X,Y-r*1.3);x.lineTo(X,Y+r*1.3);x.stroke();x.restore();}
function fmt(n){return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,',')}

const imgs={};
function load(n,src){return new Promise(r=>{const i=new Image();i.onload=()=>{imgs[n]=i;r()};i.src=src})}
function dragon(X,Y,s,{white=true,alpha=1,rot=0}={}){x.save();x.globalAlpha*=alpha;x.translate(X,Y);x.rotate(rot);
  x.drawImage(white?imgs.dw:imgs.db,-s/2,-s/2,s,s);x.restore();}
// glass orb (site's glass look) used as the "dot"
function orb(X,Y,r){x.save();
  const g=x.createRadialGradient(X-r*.3,Y-r*.35,r*.05,X,Y,r);
  g.addColorStop(0,'#ffffff');g.addColorStop(.35,P.blueHi);g.addColorStop(1,P.navy3);
  x.shadowColor='rgba(140,170,255,.7)';x.shadowBlur=r*.8;x.fillStyle=g;x.beginPath();x.arc(X,Y,Math.max(.01,r),0,7);x.fill();x.restore();}

// navy "horizon" sky with soft glass clouds
let cloudLayer=null;
function makeClouds(){const c=document.createElement('canvas');c.width=W*2;c.height=H;const g=c.getContext('2d');const r=rnd(7);g.filter='blur(12px)';
  const blob=(cx,cy,s)=>{for(let i=0;i<14;i++){const a=r()*Math.PI,d=r()*s;g.fillStyle=`rgba(200,212,255,${.18+r()*.25})`;
    g.beginPath();g.arc(cx+Math.cos(a)*d*1.8,cy-Math.sin(a)*d*.5,s*(.35+r()*.4),0,7);g.fill();}};
  for(let i=0;i<9;i++)blob(r()*W*2,900+r()*160,90+r()*70);for(let i=0;i<5;i++)blob(r()*W*2,200+r()*400,40+r()*40);
  g.filter='none';cloudLayer=c;}
const STARS=(()=>{const r=rnd(77),a=[];for(let i=0;i<140;i++)a.push([r()*W,r()*H*.75,r()]);return a})();
function sky(drift=0,t=0){const g=x.createLinearGradient(0,0,0,H);
  g.addColorStop(0,P.navy);g.addColorStop(.6,P.navy2);g.addColorStop(1,'#3a4aa8');x.fillStyle=g;x.fillRect(0,0,W,H);
  STARS.forEach(([sx,sy,s])=>{x.fillStyle=`rgba(238,241,255,${.25+.5*Math.abs(Math.sin(t*2+s*9))*s})`;x.fillRect(sx,sy,1.6+s,1.6+s);});
  x.drawImage(cloudLayer,-(drift%W),0);}

// dragon particle targets, sampled from the logo itself
let DPTS=[];
function sampleDragon(){const c=document.createElement('canvas');c.width=c.height=200;const g=c.getContext('2d');g.drawImage(imgs.db,0,0,200,200);
  const d=g.getImageData(0,0,200,200).data,r=rnd(5),pts=[];
  for(let y=0;y<200;y+=2)for(let X=0;X<200;X+=2){if(d[(y*200+X)*4+3]>128&&r()<.9)pts.push([X/200,y/200]);}
  DPTS=pts;}

// ---------- flapping dragon ----------
// The logo is one silhouette. Cut it into body + two wings (viewBox 0..496 units) and
// rotate each wing about its shoulder. Polygons were drawn against a gridded render of the mark.
const WING_L=[[0,0],[300,0],[318,262],[245,302],[0,302]], PIV_L=[300,262];
const WING_R=[[300,0],[496,0],[496,95],[395,128],[350,200],[345,224],[322,262],[318,262]], PIV_R=[328,252];
const DPART={};
function buildDragonParts(){
  const R=2; // build at 992px
  ['dw','db'].forEach(key=>{
    const img=imgs[key];
    const make=(poly,invert)=>{const c=document.createElement('canvas');c.width=c.height=496*R;const g=c.getContext('2d');
      g.drawImage(img,0,0,496*R,496*R);
      g.globalCompositeOperation=invert?'destination-out':'destination-in';
      const path=p=>{g.beginPath();p.forEach(([a,b],i)=>i?g.lineTo(a*R,b*R):g.moveTo(a*R,b*R));g.closePath();g.fill();};
      if(invert){path(WING_L);path(WING_R);}else path(poly);
      return c;};
    DPART[key]={body:make(null,true),L:make(WING_L),R:make(WING_R)};
  });
}
// phase in radians; a>0 = downstroke
// draw solid on a scratch canvas, then composite once, so overlapping parts never double up when faded
const FLAPBUF=document.createElement('canvas');FLAPBUF.width=FLAPBUF.height=1400;
function flapDragon(X,Y,s,phase,{white=true,alpha=1,rot=0}={}){
  const main=x,pad=s*.2,B=Math.ceil(s+pad*2);x=FLAPBUF.getContext('2d');x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,B,B);
  flapSolid(pad+s/2,pad+s/2,s,phase,white);
  x=main;x.save();x.globalAlpha*=alpha;x.translate(X,Y);x.rotate(rot);x.drawImage(FLAPBUF,0,0,B,B,-s/2-pad,-s/2-pad,B,B);x.restore();
}
function flapSolid(X,Y,s,phase,white){
  const parts=DPART[white?'dw':'db'],u=s/496,a=Math.sin(phase);
  x.save();x.translate(X,Y);x.translate(0,-a*s*.03);x.translate(-s/2,-s/2);
  const wing=(img,piv,ang,sx,sy)=>{x.save();x.translate(piv[0]*u,piv[1]*u);x.rotate(ang);x.scale(sx,sy);x.translate(-piv[0]*u,-piv[1]*u);
    x.drawImage(img,0,0,s,s);x.restore();};
  // far wing: mostly foreshortens toward the shoulder on the downstroke
  const fr=a>0?1-.32*a:1-.06*a;
  wing(parts.R,PIV_R,a*.1,fr,fr);
  x.drawImage(parts.body,0,0,s,s);
  // near wing: swings about the shoulder and flattens a little on the downstroke
  wing(parts.L,PIV_L,a>0?-a*.3:-a*.2,1,1-.14*Math.max(0,a));
  // hide the joint at the shoulder
  x.fillStyle=white?'#f2f2f3':'#0b0b0c';x.beginPath();x.arc((PIV_L[0]-4)*u,(PIV_L[1]+4)*u,24*u,0,7);x.fill();
  x.restore();
}
const FLAP=7.5; // wingbeat speed (rad/s)

const scenes=[];const S=(a,b,fn)=>scenes.push({a,b,fn});
// =====================================================================
// Rebuilt to follow the reference shot for shot (timings in seconds).
// Rendering: crisp main canvas + an emissive layer that is bloomed
// (downsampled, blurred, added back) so glows are soft but text stays sharp.
// =====================================================================
function mk(w,h){const c=document.createElement('canvas');c.width=Math.round(w);c.height=Math.round(h);return c;}
const E=mk(W,H),ex=E.getContext('2d');
const B1=mk(W/4,H/4),b1=B1.getContext('2d'),B2=mk(W/12,H/12),b2=B2.getContext('2d');
function emit(fn){const m=x,T=m.getTransform();x=ex;x.save();x.setTransform(T);x.globalAlpha=m.globalAlpha;fn();x.restore();x=m;} // glow layer follows the camera
function bloom(str=1){
  b1.clearRect(0,0,B1.width,B1.height);b1.filter='blur(2px)';b1.drawImage(E,0,0,B1.width,B1.height);
  b2.clearRect(0,0,B2.width,B2.height);b2.filter='blur(2px)';b2.drawImage(B1,0,0,B2.width,B2.height);
  x.save();x.globalCompositeOperation='lighter';x.imageSmoothingQuality='high';
  x.globalAlpha=.85*str;x.drawImage(B1,0,0,W,H);x.globalAlpha=1.1*str;x.drawImage(B2,0,0,W,H);x.globalAlpha=.6*str;x.drawImage(E,0,0);x.restore();}

const BLUE=[70,105,255],ICE=[200,214,255],WHITE=[236,240,252];
const rgb=(c,a=1)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
const mix=(a,b,k)=>[lerp(a[0],b[0],k),lerp(a[1],b[1],k),lerp(a[2],b[2],k)];

// text on the main canvas (optionally defocused) + its halo on the glow layer
function txt(s,X,Y,size,{f='N',w=400,c=WHITE,a='left',alpha=1,blur=0,ls=0,glow=0,glowC=BLUE}={}){
  if(alpha<=.003)return;
  const draw=(col,al,bl)=>{x.save();x.globalAlpha*=al;font(size,w,f);x.textAlign=a;x.textBaseline='alphabetic';
    if(ls)x.letterSpacing=ls+'px';if(bl>.25)x.filter=`blur(${bl}px)`;x.fillStyle=rgb(col);x.fillText(s,X,Y);x.restore();};
  draw(c,alpha,blur);
  if(glow>0)emit(()=>draw(glowC,alpha*glow,blur+size*.04));}
function tw(s,size,w=400,f='N',ls=0){font(size,w,f);x.letterSpacing=ls+'px';const v=x.measureText(s).width;x.letterSpacing='0px';return v;}

// comet: a smooth tapered ribbon along path(τ) from τ=t-len to t, brightest and widest at the head.
// Drawn as a few overlapping continuous strokes (each covering less of the tail), so there are no beads.
function comet(path,t,len,w,alpha=1,t0=-1e9){
  if(alpha<=.01)return;const a0=Math.max(t-len,t0);if(t-a0<.004)return;const N=32,P=[];
  for(let i=0;i<=N;i++)P.push(path(lerp(a0,t,i/N)));
  const FR=[1,.8,.62,.46,.32,.2,.1];
  const pass=(lw,col,al)=>{x.save();x.lineCap='round';x.lineJoin='round';x.strokeStyle=col;
    FR.forEach(f=>{const st=Math.floor(N*(1-f));x.globalAlpha=alpha*al*.3;x.lineWidth=lw*(1.12-f);
      x.beginPath();x.moveTo(...P[st]);for(let i=st+1;i<=N;i++)x.lineTo(...P[i]);x.stroke();});
    x.globalAlpha=alpha*al;x.fillStyle=col;x.beginPath();x.arc(...P[N],lw*.5,0,7);x.fill();x.restore();};
  pass(w*.62,'rgb(238,244,255)',1);
  emit(()=>{pass(w*2.8,rgb(BLUE),.9);pass(w*1.3,'rgb(170,190,255)',.9);});}

// soft neon ring: a thin bright line with a graded halo (no hard stripes); fades in/out along its length
function ringArc(cx,cy,r,a0,len,w,alpha){if(alpha<=.01)return;
  const pass=(lw,c,al)=>{const g=x.createConicGradient(a0,cx,cy),f=Math.min(.999,len/(Math.PI*2));
    g.addColorStop(0,rgb(c,0));g.addColorStop(f*.5,rgb(c,al*alpha));g.addColorStop(f,rgb(c,0));g.addColorStop(1,rgb(c,0));
    x.save();x.strokeStyle=g;x.lineWidth=lw;x.lineCap='butt';x.beginPath();x.arc(cx,cy,r,a0,a0+len);x.stroke();x.restore();};
  pass(w*.62,[70,100,255],.10);pass(w*.36,[100,130,255],.16);pass(w*.18,[150,175,255],.3);pass(w*.06,[220,230,255],.85);
  emit(()=>{pass(w*1.1,BLUE,.55);pass(w*.45,[130,160,255],.7);});}

// the saturated blue "floor" glow: drawn tiny, blurred, scaled up
const FL=mk(192,108),fl=FL.getContext('2d');
function floor(t,level=1,crest=H*.72,{dip=.42,hill=.82}={}){if(level<=0)return;
  const s=192/W;fl.clearRect(0,0,192,108);fl.save();fl.filter='blur(5px)';fl.scale(s,s);
  const path=(off,amp)=>{fl.beginPath();fl.moveTo(-200,H+300);
    for(let i=0;i<=40;i++){const u=i/40,X=-200+u*(W+400);
      const y=crest+off+amp*(38*Math.sin(u*4.2+t*.85)+22*Math.sin(u*9.5-t*1.15)+90*Math.exp(-Math.pow((u-dip)*4.5,2))-110*Math.exp(-Math.pow((u-hill)*3.2,2)));
      fl.lineTo(X,y);}fl.lineTo(W+200,H+300);fl.closePath();};
  let g=fl.createLinearGradient(0,crest-150,W,H);g.addColorStop(0,'rgb(18,34,150)');g.addColorStop(.55,'rgb(32,62,235)');g.addColorStop(1,'rgb(60,96,255)');
  path(0,1);fl.fillStyle=g;fl.fill();
  g=fl.createLinearGradient(0,crest,0,H);g.addColorStop(0,'rgba(90,125,255,0)');g.addColorStop(.6,'rgba(90,125,255,.55)');g.addColorStop(1,'rgba(120,150,255,.8)');
  path(60,.8);fl.fillStyle=g;fl.fill();fl.restore();
  x.save();x.globalAlpha=clamp(level);x.imageSmoothingQuality='high';x.drawImage(FL,0,0,W,H);x.restore();}
// one continuous floor state for 2.0–8.5 so no shot boundary can pop it
const FLOOR_SHAPE={dip:.48,hill:.84};
function floorState(t){
  if(t<6.0)return [prog(t,2.3,3.0),lerp(H*1.05,H*.76,eo(prog(t,2.3,3.2)))];
  if(t<7.2){const k=eio(prog(t,6.0,7.2));return [lerp(1,.5,k),lerp(H*.76,H*.9,k)];}
  const k=eio(prog(t,7.2,8.5));return [lerp(.5,.85,k),lerp(H*.9,H*.84,k)];}
function floorAt(t){const [l,c]=floorState(t);floor(t,l,c,FLOOR_SHAPE);}
function vignette(a=.55){const g=x.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,H*1.1);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,`rgba(0,0,0,${a})`);x.fillStyle=g;x.fillRect(0,0,W,H);}
const easeQ=k=>1-Math.pow(1-k,4);

// ---------------------------------------------------------------- 0 – 2.0
// dragon scales in, letters glow in one by one while the word re-centres; the camera
// keeps drifting and the rings keep turning; then six letters stretch into comets
const WORD='Mentaljineer',WSZ=104,ICON=92,GAP=26;
const LA=[...WORD].map((_,i)=>.30+i*.055);           // letter appear times
const LD=[...WORD].map((_,i)=>1.68+i*.04);           // letter dissolve times (one at a time)
const COMETS=[0,2,4,6,8,10];                          // only six letters become streaks
let LW=null;
function layoutWord(){LW=[...WORD].map(ch=>tw(ch,WSZ,500));}
function groupCam(t){const k=clamp(t/2.1),m=k*.65+eio(k)*.35;   // never settles: near-linear drift
  return {s:lerp(1.06,.95,m),dy:lerp(18,-40,m),dx:lerp(-16,22,m)};}
const CR=rnd(91),CP=[...WORD].map((_,i)=>{const k=Math.max(0,COMETS.indexOf(i)),ang=-Math.PI*(.78-.56*k/5),sp=520+CR()*200;
  return {vx:Math.cos(ang)*sp,up:-Math.sin(ang)*sp,g:240+CR()*100,A:100+CR()*60,B:70+CR()*40,om:4.2+CR()*1.8,ph:CR()*6.28};});
function wordLayout(t){const tt=Math.min(t,LD[0]);
  const VW=ICON+GAP+LW.reduce((a,w,j)=>a+w*eio(prog(tt,LA[j],LA[j]+.42)),0);return {left:W/2-VW/2,c:groupCam(t)};}
function letterPos(i,t){const {left,c}=wordLayout(t);let lx=left+ICON+GAP;for(let j=0;j<i;j++)lx+=LW[j];lx+=LW[i]/2;
  return [W/2+(lx-W/2+c.dx)*c.s,H/2+(c.dy-WSZ*.33)*c.s];}
function cometPath(i){const t0=LD[i]+.03,[lx,ly]=letterPos(i,t0);const p=CP[i];
  return tau=>{const s=Math.max(0,tau-t0);
    return [lx+p.vx*s+p.A*(Math.sin(p.om*s+p.ph)-Math.sin(p.ph)),
            ly-p.up*s+p.g*s*s*.5+p.B*(Math.cos(p.om*s+p.ph)-Math.cos(p.ph))];};}
let CPATH=null;
function swarm(t){ // six comets; they stay above the rising chat box and are gone before its words land
  COMETS.forEach((i,k)=>{const t0=LD[i]+.03;if(t<t0||t>3.05)return;
    const head=CPATH[i](t),top=boxY(t);
    const al=prog(t,t0,t0+.05)*(1-prog(t,2.62+k*.05,2.92+k*.02))*(1-prog(head[1],top-170,top-70));
    comet(CPATH[i],t,.36,14,al,t0);});}
function introLight(t,fade){
  const amb=prog(t,.1,1.0)*fade;
  if(amb>0){const g=x.createRadialGradient(W/2,H/2+20,H*.18,W/2,H/2+20,H*1.05);
    g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(.45,`rgba(28,44,150,${.3*amb})`);g.addColorStop(.75,`rgba(36,58,190,${.4*amb})`);g.addColorStop(1,`rgba(10,16,60,${.3*amb})`);
    x.fillStyle=g;x.fillRect(0,0,W,H);}
  [[.40,.10,2.6,2.0,.55],[.62,.30,3.2,4.1,-.42],[.86,.48,2.4,.9,.36],[1.1,.62,3.0,3.3,-.30]].forEach(([rf,ta,len,a0,sp])=>{
    const r=H*rf*(1+.14*clamp(t/2.4)),a=eio(prog(t,ta,ta+.6))*fade;
    ringArc(W/2,H/2+20,r,a0+t*sp,len*lerp(.55,1,eio(prog(t,ta,ta+.9))),95,a);});}
S(0,2.0,t=>{
  bg('#000');introLight(t,1);
  const {left,c}=wordLayout(t);
  x.save();x.translate(W/2,H/2);x.scale(c.s,c.s);x.translate(-W/2+c.dx,-H/2+c.dy);
  // dragon: scales in with a glow that blooms then settles
  const ia=eio(prog(t,.06,.4))*(1-prog(t,1.6,1.78));
  if(ia>0){const pos=[left+ICON/2,H/2-WSZ*.36],sz=ICON*lerp(.78,1,eo(prog(t,.06,.7))),ph=t*FLAP*.5;
    flapDragon(pos[0],pos[1],sz,ph,{alpha:ia});
    emit(()=>flapDragon(pos[0],pos[1],sz,ph,{alpha:ia*(.4+.5*(1-prog(t,.3,1.0)))}));}
  // letters: glow in; six of them stretch upward into a comet, the rest melt away
  let lx=left+ICON+GAP;
  [...WORD].forEach((ch,i)=>{const p=eio(prog(t,LA[i],LA[i]+.42)),isC=COMETS.includes(i);
    const d=isC?prog(t,LD[i],LD[i]+.09):eio(prog(t,LD[i],LD[i]+.16));const al=p*(1-d);
    if(al>0){if(isC&&d>0){const cx=lx+LW[i]/2,cy=H/2-WSZ*.33;x.save();x.translate(cx,cy);x.scale(1-.45*d,1+1.8*d);x.translate(-cx,-cy);
        txt(ch,lx,H/2,WSZ,{w:500,alpha:al,blur:d*3,c:mix(WHITE,[200,215,255],d),glow:.3+1.2*d});x.restore();}

// ---------------------------------------------------------------- 2.0 – 6.8

// heading + chips appear, quick zoom to the menu that eases out into a drift,
// selection changes, slow pull out, then the UI defocuses

const MR=rnd(12),MOFF=MSG.map((_,i)=>[(MR()-.5)*40,(i%2?-1:1)*(42+MR()*26)]),MJIT=MSG.map(()=>MR()*.03); // near-vertical paths: words never cross
const HEAD=['Build','your','own','tutor.'];
const CHIPS=['Plugin Creator','Paste the brief','Paste the prompt','Enable it','Test it'];
const MENU=[['Plugin Creator','Builds private plugins for you'],['Adaptive Tutor','Teaches at the edge of what you know'],['Settings → Plugins','If Plugin Creator isn’t listed']];
function boxY(t){return lerp(H*1.12,H*.46,eo(prog(t,2.05,2.85)))-lerp(0,H*.06,eio(prog(t,3.15,3.6)));}

  const d=prog(t,4.4,5.75);s+=.12*d*z;cx-=70*d*z;cy+=18*d*z;          // linear drift while zoomed
  const o=eio(prog(t,5.65,6.3));s=lerp(s,1.12,o);cx=lerp(cx,W/2+30,o);cy=lerp(cy,H/2-10,o);

function drawUI(t){

  const hy=by-78,hw=HEAD.map(w=>tw(w,66,400)),sp=18,total=hw.reduce((a,b)=>a+b,0)+sp*(HEAD.length-1)+76;
  let hx=W/2-total/2;const da=prog(t,3.2,3.4);

  hx+=76;HEAD.forEach((w,i)=>{const p=eo(prog(t,3.26+i*.08,3.56+i*.08));txt(w,hx,hy,66,{alpha:p,blur:(1-p)*6,c:mix([120,126,150],WHITE,p)});hx+=hw[i]+sp;});
  // box

  x.strokeStyle='rgba(255,255,255,.10)';x.lineWidth=2;x.stroke();x.restore();
  // message words: appear in reading order near their slot and glide in (short paths, no collisions)
  let wx=bx+44;const wy=by+66;
  MSG.forEach(([w,men],i)=>{const ww=tw(w,30,men?500:400,'G');const a=2.70+i*.05+MJIT[i],p=eo(prog(t,a,a+.34));

      txt(w,X,Y,30,{f:'G',w:men?500:400,alpha:clamp(p*3),blur:(1-p)*2.5,c:men?mix(ICE,[150,175,255],p):mix(ICE,WHITE,p),glow:lerp(1.1,0,p)});}
    wx+=ww+(i===1?14:10);});
  // footer: plus, selector, send
  const fa=prog(t,3.28,3.5);

    const sx=bx+BOXW-96;x.save();x.globalAlpha=fa;x.fillStyle='rgb(60,92,245)';rr(sx+10,by+BOXH-74,52,52,13);x.fill();
    x.strokeStyle='#fff';x.lineWidth=4;x.lineCap='round';x.lineJoin='round';x.beginPath();x.moveTo(sx+36,by+BOXH-36);x.lineTo(sx+36,by+BOXH-60);x.moveTo(sx+26,by+BOXH-50);x.lineTo(sx+36,by+BOXH-60);x.lineTo(sx+46,by+BOXH-50);x.stroke();x.restore();
    emit(()=>{x.globalAlpha=fa*.5;x.fillStyle=rgb(BLUE);rr(sx+10,by+BOXH-74,52,52,13);x.fill();});
    const sw=eio(prog(t,5.32,5.58)),rx=sx-14;
    x.save();x.beginPath();x.rect(rx-320,by+BOXH-78,330,60);x.clip();
    txt('Plugin Creator  ⌄',rx,by+BOXH-38-26*sw,22,{f:'G',w:500,a:'right',c:[200,204,218],alpha:fa*(1-sw)});
    txt('Adaptive Tutor  ⌄',rx,by+BOXH-38+26*(1-sw),22,{f:'G',w:600,a:'right',c:[150,175,255],alpha:fa*sw,glow:.4*sw});
    x.restore();}
  // chips
  const cw=CHIPS.map(c=>tw(c,21,500,'G')+78),ctot=cw.reduce((a,b)=>a+b,0)+14*(CHIPS.length-1);let cx0=W/2-ctot/2;
  CHIPS.forEach((c,i)=>{const p=eo(prog(t,3.34+i*.06,3.6+i*.06));if(p>0){
    x.save();x.globalAlpha=p;x.strokeStyle='rgba(255,255,255,.16)';x.lineWidth=2;rr(cx0,by+BOXH+22,cw[i],50,14);x.stroke();x.restore();
    txt(String(i+1),cx0+24,by+BOXH+55,19,{f:'M',w:600,c:[150,175,255],alpha:p});
    txt(c,cx0+50,by+BOXH+55,21,{f:'G',w:500,c:[200,204,218],alpha:p});}cx0+=cw[i]+14;});
  // mention menu: opens with the zoom, closes during the pull-out so it never sits on the heading
  const ma=eo(prog(t,4.2,4.36))*(1-eio(prog(t,5.8,6.1)));
  if(ma>0){const mw=470,mh=246,mx=bx+BOXW-mw-60,my=by-mh+40+10*(1-ma);
    x.save();x.globalAlpha=ma;x.shadowColor='rgba(0,0,0,.6)';x.shadowBlur=40;x.fillStyle='rgb(30,31,37)';rr(mx,my,mw,mh,18);x.fill();
    x.shadowColor='transparent';x.strokeStyle='rgba(255,255,255,.10)';x.lineWidth=1.5;x.stroke();
    const sel=eio(prog(t,5.32,5.58));x.fillStyle='rgba(255,255,255,.06)';rr(mx+8,my+10+lerp(0,74,sel),mw-16,70,12);x.fill();x.restore();
    MENU.forEach(([n,d],i)=>{const iy=my+46+i*74;
      txt(n,mx+26,iy,23,{f:'G',w:500,c:i===2?[176,180,196]:WHITE,alpha:ma});
      txt(d,mx+26,iy+26,16,{f:'G',w:400,c:[140,144,160],alpha:ma*eo(prog(t,4.42+i*.12,4.75+i*.12))});});
    [[0,1-sel],[1,sel]].forEach(([i,a])=>{if(a<=0)return;const ty=my+40+i*74;x.save();x.globalAlpha=ma*a;x.strokeStyle='rgb(160,182,255)';x.lineWidth=3;x.lineCap='round';x.lineJoin='round';
      x.beginPath();x.moveTo(mx+mw-52,ty);x.lineTo(mx+mw-43,ty+9);x.lineTo(mx+mw-27,ty-8);x.stroke();x.restore();});}

const UIC=mk(W,H);let emitOff=false;const _emit=emit;emit=function(fn){if(emitOff)return;_emit(fn);};
S(2.0,6.8,t=>{
  bg('#000');

});
// a single comet leaves the send button once the UI starts to defocus, loops up and round on the

const LOOP_T0=6.35;let LOOP=null;
function buildLoop(){const c=uiCam(LOOP_T0),by=boxY(LOOP_T0),wx=W/2+BOXW/2-96+36,wy=by+BOXH-48;
  const sx=W/2+(wx-c.cx)*c.s,sy=H/2+(wy-c.cy)*c.s;

    const cx=sx+140+110*s,cy=sy-40-150*s;return [cx+R*Math.cos(a),cy+R*Math.sin(a)*.85];};}
S(6.8,7.18,t=>{bg('#000');floorAt(t);comet(LOOP,t,.3,12,1-prog(t,7.05,7.3));bloom();vignette(.45);});
